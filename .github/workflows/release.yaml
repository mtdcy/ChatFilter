---
name: Release ChatFilter

on:
  push:
    tags:
      - 'v*'

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |-
          TEMPDIR="$(mktemp -d)"
          trap 'rm -rf $TEMPDIR' EXIT

          mkdir -pv "$TEMPDIR/ChatFilter"

          cp ChatFilter.* "$TEMPDIR/ChatFilter"

          cd "$TEMPDIR" && zip -r ChatFilter.zip ChatFilter && cd -

          mv "$TEMPDIR/ChatFilter.zip" "ChatFilter ${{ github.ref_name }}.zip"

          gh release create "${{ github.ref_name }}" \
            --repo="$GITHUB_REPOSITORY" \
            --title="Release ${{ github.ref_name }}" \
            --generate-notes || true

      - name: Artifacts
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          append_body: false
          draft: false
          prerelease: false
          make_latest: true
          files: |-
            ChatFilter*.zip
